<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">HWPE MAC control and data paths</title>
  <desc id="desc">The peripheral interface configures mac_ctrl and mac_fsm. The controller drives mac_streamer and mac_engine. The streamer exchanges HWPE-Mem traffic with shared L2 TCDM and A, B, C, and D streams with the compute engine. The controller produces completion events.</desc>
  <defs>
    <marker id="data-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="control-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .boundary { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .external { fill: #ffffff; stroke: #64748b; stroke-width: 2; }
      .control-box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .data-box { fill: #f0fdfa; stroke: #0f766e; stroke-width: 2; }
      .title { fill: #0f172a; font: 600 22px Arial, sans-serif; }
      .label { fill: #334155; font: 17px Arial, sans-serif; }
      .small { fill: #475569; font: 15px Arial, sans-serif; }
      .boundary-label { fill: #475569; font: 600 18px Arial, sans-serif; letter-spacing: 0.4px; }
      .control-line { fill: none; stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#control-arrow); }
      .data-line { fill: none; stroke: #0f766e; stroke-width: 3; marker-end: url(#data-arrow); }
    </style>
  </defs>

  <rect width="1200" height="600" fill="#ffffff"/>
  <rect class="boundary" x="300" y="30" width="650" height="500" rx="10"/>
  <text class="boundary-label" x="325" y="62">hwpe-mac-engine</text>

  <rect class="external" x="30" y="100" width="220" height="100" rx="8"/>
  <text class="title" x="140" y="140" text-anchor="middle">HWPE-Periph</text>
  <text class="small" x="140" y="171" text-anchor="middle">configuration interface</text>

  <rect class="external" x="30" y="360" width="220" height="110" rx="8"/>
  <text class="title" x="140" y="402" text-anchor="middle">Shared L2 / TCDM</text>
  <text class="small" x="140" y="435" text-anchor="middle">four memory ports</text>

  <rect class="external" x="990" y="100" width="180" height="100" rx="8"/>
  <text class="title" x="1080" y="140" text-anchor="middle">Completion</text>
  <text class="small" x="1080" y="171" text-anchor="middle">event output (evt_o)</text>

  <rect class="control-box" x="390" y="90" width="300" height="120" rx="8"/>
  <text class="title" x="540" y="137" text-anchor="middle">mac_ctrl / mac_fsm</text>
  <text class="small" x="540" y="170" text-anchor="middle">contexts, uLoop, job control</text>

  <rect class="data-box" x="370" y="340" width="240" height="150" rx="8"/>
  <text class="title" x="490" y="387" text-anchor="middle">mac_streamer</text>
  <text class="small" x="490" y="420" text-anchor="middle">A/B/C sources</text>
  <text class="small" x="490" y="447" text-anchor="middle">D sink and FIFOs</text>

  <rect class="data-box" x="690" y="340" width="220" height="150" rx="8"/>
  <text class="title" x="800" y="387" text-anchor="middle">mac_engine</text>
  <text class="small" x="800" y="420" text-anchor="middle">signed multiply</text>
  <text class="small" x="800" y="447" text-anchor="middle">accumulate and shift</text>

  <path class="control-line" d="M 250 150 L 390 150"/>
  <text class="small" x="320" y="136" text-anchor="middle">request / response</text>

  <path class="control-line" d="M 690 150 L 990 150"/>
  <text class="small" x="840" y="136" text-anchor="middle">done / event</text>

  <path class="control-line" d="M 470 210 L 470 340"/>
  <text class="small" x="455" y="278" text-anchor="end">streamer control</text>

  <path class="control-line" d="M 610 210 L 610 265 L 800 265 L 800 340"/>
  <text class="small" x="705" y="252" text-anchor="middle">engine control</text>

  <path class="data-line" d="M 250 395 L 370 395"/>
  <path class="data-line" d="M 370 445 L 250 445"/>
  <text class="small" x="310" y="382" text-anchor="middle">loads</text>
  <text class="small" x="310" y="468" text-anchor="middle">stores</text>

  <path class="data-line" d="M 610 390 L 690 390"/>
  <text class="small" x="650" y="377" text-anchor="middle">A / B / C</text>

  <path class="data-line" d="M 690 445 L 610 445"/>
  <text class="small" x="650" y="468" text-anchor="middle">D</text>

  <line x1="365" y1="565" x2="415" y2="565" stroke="#0f766e" stroke-width="3"/>
  <text class="small" x="425" y="571">data path</text>
  <line x1="600" y1="565" x2="650" y2="565" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text class="small" x="660" y="571">control path</text>
</svg>
